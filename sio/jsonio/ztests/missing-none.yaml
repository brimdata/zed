script: |
  super -o test.bsup -i json test.json
  super -s -c "values a" test.bsup

inputs:
  - name: test.json
    data: |
      {"a":{"b":1}}
      {"c":{"d":2}}

outputs:
  - name: stdout
    data: |
      {b:1}
      error({message:"no such field a",on:{}})

---

script: |
  super -f bsup -o in.bsup in.json
  super -s -I query.spq

inputs:
  - name: in.json
    data: |
      {"kind":"commit","commit":{"collection":"a"}}
      {"kind":"identity","identity":{"handle":"x"}}
  - name: query.spq
    data: |
      SELECT
        commit.collection AS event,
        count() AS count
      FROM 'in.bsup'
      GROUP BY event
      ORDER BY count DESC, event

outputs:
  - name: stdout
    data: |
      {event:"a",count:1}
      {event:null,count:1}
