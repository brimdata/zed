script: |
  super db init -q test
  super db attach -q test
  super db create -orderby a TABLE
  super db load -q -use TABLE in.sup
  super db -s -c "from TABLE@main:rawlog"
  super db log -use TABLE

inputs:
  - name: in.sup
    data: |
      {a:1}
      {a:2}
      {a:3}

outputs:
  - name: stdout
    regexp: loaded 1 data object
