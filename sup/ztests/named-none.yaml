spq: pass

flags: -i sup

input: |
  type foo=missing
  {a?:none::option(foo)}

error: |
  stdio:stdin: option some type cannot be type missing

---

spq: pass

flags: -i sup

input: |
  type foo=missing
  {a:missing::foo}

error: |
  stdio:stdin: missing value assigned to field a

---

spq: pass

input: &input |
  type foo=missing
  missing::foo

output: *input

---

spq: values this ?? missing::bar

input: |
  type foo=missing
  type bar=foo
  missing::foo

output: |
  type foo=missing
  type bar=foo
  missing::bar
