spq: values this.ok()

input: |
  1
  [3,2,1,0]
  "s"::(string|null)
  error("baz")
  type foo=error(string)
  error("baz")::foo
  type bar=string
  error("baz"::bar)
  null
  error(null)
  error("quiet")
  error({x:"baz"})

output: |
  1
  [3,2,1,0]
  "s"::(string|null)
  none
  none
  none
  null
  none
  none
  none

---

spq: values x.ok()

input: |
  {x:1}
  {y:1}

output: |
  1
  none

---

spq: cut a:=x.ok() ?? missing,b:=x

input: |
  {x:1}
  {y:1}

output: |
  {a:1,b:1}
  {b:error("no such field x")}
