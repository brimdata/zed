# Casting the singleton none to an option type yields the option's none
# and casting none to a non-option type T is shorthand for option(T).
# Casting missing yields missing.
spq: |
  values
    none,
    cast(none,<option(int64)>),
    [1,none],
    [1,none]::[option(int64)],
    {a:[none,1]}::{a:[option(int64)]},
    none::int64,
    none::option(int64),
    none::(int64|string),
    none::(int64|none),
    cast(missing,<option(int64)>),
    missing::int64,
    typeof([]),
    typeof(set[]),
    typeof(map{})

output: |
  none
  none::int64
  [1,none]
  [some(1),none::int64]
  {a:[none::int64,some(1)]}
  none::int64
  none::int64
  none::option(int64|string)
  none::(int64|none)
  error("cannot cast missing (consider ??)")
  error("cannot cast missing (consider ??)")
  <[none]>
  <set[none]>
  <map{none:none}>

---

# Any use of none other than casting it is an error.
spq: values none ?? 1

error: |
  illegal use of none value at line 1, column 8:
  values none ?? 1
         ~~~~

---

spq: values [1,none] | values this[0]+1

error: |
  illegal use of none value at line 1, column 26:
  values [1,none] | values this[0]+1
                           ~~~~~~~

---

spq: values {a:none},{a:1} | sort a

error: |
  illegal use of none value at line 1, column 30:
  values {a:none},{a:1} | sort a
                               ~
