spq: |
  switch
    case a == 1 ( put v:='one' )
    case a / 0 ( put v:='xxx' )
    case a % 0 ( put v:='yyy' )
  | sort this

input: |
  {a:1,s:"a"}
  {a:2,s:"b"}

output: |
  {a:1,s:"a",v:"one"}
  error({message:"switch: error value encountered",on:error("divide by zero")})
  error({message:"switch: error value encountered",on:error("divide by zero")})
