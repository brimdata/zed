# Sort by type name first so the order of differently typed errors doesn't
# depend on type IDs, which differ when input is fused.
spq: shapes s2 | sort typeof(this)::string, this

input: |
  {s1:"a",s2:"b"}
  {s1:"a",s2:0}
  {s1:"a",s2:null}
  {s1:"a",s2:null::(null|{x:int64})}
  {s1:"a"}
  {s1:"a",s2:error(1)}
  {s1:"a",s2:error({x:1})}

output: |
  error({message:"where: error value encountered",on:error({message:"'not' operator: error value encountered",on:error(1)})})
  error({message:"where: error value encountered",on:error({message:"'not' operator: error value encountered",on:error("no such field s2")})})
  error({message:"where: error value encountered",on:error({message:"'not' operator: error value encountered",on:error({x:1})})})
  0
  "b"
