script: |
  source service.sh
  for table in match1 match2 nope; do
    super db create -q $table
    echo "\"$table\"" | super db load -q -use $table -
  done
  super db -s -c 'from * | sort this'
  echo ===
  super db -s -c 'from /.*/ | sort this'
  echo ===
  super db -s -c 'from match* | sort this'
  echo ===
  super db -s -c 'from /match/ | sort this'

inputs:
  - name: service.sh

outputs:
  - name: stdout
    data: |
      "match1"
      "match2"
      "nope"
      ===
      "match1"
      "match2"
      "nope"
      ===
      "match1"
      "match2"
      ===
      "match1"
      "match2"
