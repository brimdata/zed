script: |
  source service.sh
  curl -X POST -d '{"name":"test","sortkeys":[{"order":"desc","path":["ts"]}]}' $DB_URL/table > table.sup
  tableID=$(super -f line -c "values table.id" table.sup)
  curl -X POST --data-binary @- $DB_URL/table/$tableID/branch/main | super -s -c "commit:=0" -

inputs:
  - name: stdin
    # Generated with `bash -c 'gzip -c <<<{x:1} | base64'`.
    data: !!binary |
      H4sIAMaiGmEAA6uusDKs5QIAaI7+2QYAAAA=
  - name: service.sh
    source: service.sh

outputs:
  - name: stdout
    data: |
      {commit:0,warnings:[]::[string]}
