script: |
  source service.sh
  super db create -q TABLE
  super db load -q -use TABLE a.sup
  super db branch -q -use TABLE child
  super db load -q -use TABLE@child b.sup
  super db -s -c "from TABLE | sort this"
  echo ===
  super db merge -q -use TABLE@child main
  super db -s -c "from TABLE | sort this"

inputs:
  - name: a.sup
    data: |
      {a:1}
  - name: b.sup
    data: |
      {b:1}
  - name: service.sh
    source: service.sh

outputs:
  - name: stdout
    data: |
      {a:1}
      ===
      {a:1}
      {b:1}
