script: |
  source service.sh
  super db create -q test
  curl -w 'code %{response_code}\n' -d '' $DB_URL/query
  curl -w 'code %{response_code}\n' -d '{"query":""}' $DB_URL/query
  curl -w 'code %{response_code}\n' -d '{"query":"from HEAD"}' $DB_URL/query
  curl -w 'code %{response_code}\n' -d '{"query":"from :unknownmeta"}' $DB_URL/query
  curl -w 'code %{response_code}\n' -d '{"query":"from doesnotexist"}' $DB_URL/query

inputs:
  - name: service.sh

outputs:
  - name: stdout
    data: |
      {"type":"Error","kind":"invalid operation","error":"query text is missing"}
      code 400
      {"type":"Error","kind":"invalid operation","error":"query text is missing"}
      code 400
      {"type":"Error","kind":"invalid operation","error":"HEAD: table not found at line 1, column 6:\nfrom HEAD\n     ~~~~","compilation_errors":[{"Msg":"HEAD: table not found","Pos":5,"End":8}]}
      code 400
      {"type":"Error","kind":"invalid operation","error":"unknown database metadata type \"unknownmeta\" in from operator at line 1, column 6:\nfrom :unknownmeta\n     ~~~~~~~~~~~~","compilation_errors":[{"Msg":"unknown database metadata type \"unknownmeta\" in from operator","Pos":5,"End":16}]}
      code 400
      {"type":"Error","kind":"invalid operation","error":"doesnotexist: table not found at line 1, column 6:\nfrom doesnotexist\n     ~~~~~~~~~~~~","compilation_errors":[{"Msg":"doesnotexist: table not found","Pos":5,"End":16}]}
      code 400
