script: |
  export SUPER_DB=test
  export SUPER_HEAD_DIR=x
  mkdir x
  super db init -q
  super db create -q -q TABLE
  super db use -q TABLE
  cat x/.super_head
  export SUPER_HEAD_DIR=.
  mkdir y
  cd y
  super db use -attach ../test -q TABLE
  cat .super_head

outputs:
  - name: stdout
    data: |
      TABLE@main
      TABLE@main
