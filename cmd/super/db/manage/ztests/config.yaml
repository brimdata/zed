script: |
  export SUPER_DB=test
  super db init -q
  super db create -q test1
  super db create -q test2
  super db create -q test3
  super db branch -use test2 -q live
  super db manage -config=inherit.yaml -log.path=inherit-log.json
  super -S -c 'msg == "updating table" | cut name, branch | sort name' inherit-log.json > inherit.sup

inputs:
  - name: inherit.yaml
    data: |
      interval: 1s
      tables:
        - table: test1
        - table: test2
          branch: "live"

outputs:
  - name: inherit.sup
    data: | 
      {
        name: "test1",
        branch: "main"
      }
      {
        name: "test2",
        branch: "live"
      }
  - name: stderr
    data: ""
  - name: stdout
    data: ""
