script: |
  super -dynamic -s -c "? a*b" in.sup
  echo ===
  super -dynamic -s -c "? a*b=s" in.sup

inputs:
  - name: in.sup
    data: |
      {s:"axb"}
      {s:6,a:2,b:3}
      {s:7,a:2,b:3}

outputs:
  - name: stdout
    data: |
      {s:"axb"}
      ===
      error({message:"where: error value encountered",on:error({message:"==: error value encountered",on:error({message:"*: error value encountered",on:error("no such field a")})})})
      {s:6,a:2,b:3}
