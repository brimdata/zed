script: |
  super -o test.bsup test.sup
  super -o test.json test.sup
  super -o test.parquet -c blend test.sup
  gzip -c test.sup > test.sup.gz
  for format in bsup json parquet sup sup.gz; do
    echo "=== $format (default)"
    super compile -C -dag "from test.$format"
    super compile -C -dag pass test.$format
    echo "=== $format (static)"
    super compile -C -dag -static "from test.$format"
    super compile -C -dag -static pass test.$format
    echo "=== $format (default pipe)"
    cat test.$format | super compile -C -dag "from /dev/stdin"
    cat test.$format | super compile -C -dag pass /dev/stdin
    echo "=== $format (static pipe)"
    ! cat test.$format | super compile -C -dag -static "from /dev/stdin" 2>&1
    ! cat test.$format | super compile -C -dag -static pass /dev/stdin 2>&1
  done

inputs:
  - name: test.sup
    data: |
      {x:1}
      {y:1}

outputs:
  - name: stdout
    data: |
