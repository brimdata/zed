script: |
  super db init -q test
  super db attach -q test
  ! super db compile -C -dag 'from test'
  echo === >&2
  ! super db compile -C -dag 'from test*'
  echo === >&2
  ! super db compile -C -dag 'from /test/'

outputs:
  - name: stderr
    data: |
      test: table not found at line 1, column 6:
      from test
           ~~~~
      ===
      test*: table matching glob not found at line 1, column 6:
      from test*
           ~~~~~
      ===
      test: table matching regexp not found at line 1, column 6:
      from /test/
           ~~~~~~
