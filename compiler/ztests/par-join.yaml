script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby ts test
  # At the time of writing, the where operator is necessary because a table scan
  # is parallelized only when followed by another operator.
  super db compile -C -P 2 "from test | where true | join (from test | where true) on left.a=right.b" | sed -e 's/table .*/.../'

outputs:
  - name: stdout
    data: |
      fork
        (
          lister ...
          | slicer
          | scatter
            (
              seqscan ...
            )
            (
              seqscan ...
            )
          | merge ts asc nulls last
        )
        (
          lister ...
          | slicer
          | scatter
            (
              seqscan ...
            )
            (
              seqscan ...
            )
          | merge ts asc nulls last
        )
      | inner hashjoin as {left,right} on a==b
      | output main
