script: |
  super db init -q test
  super db attach -q test
  super db create -q TABLE
  super db use -q TABLE
  super db load -q a.sup
  super db branch -q child
  super db use -q @child
  super db load -q b.sup
  super db -s -c "from TABLE"

inputs:
  - name: a.sup
    data: |
      {a:1}
  - name: b.sup
    data: |
      {b:1}

outputs:
  - name: stdout
    data: |
      {a:1}
