script: |
  super db init -q test
  super db attach -q test
  super db create -use -q -orderby k TABLE
  super db load -q -message "initial load of a.sup into main" a.sup
  super db branch -q child
  super db use -q @child
  super db load -q -message "initial load of b.sup into child" b.sup
  echo === main ===
  super db -s -c "from TABLE"
  echo === child ===
  super db -s -c "from TABLE@child"
  echo === child after merge ===
  super db merge -q main
  super db -s -c "from TABLE@child"
  echo === main after merge ===
  super db -s -c "from TABLE"
  echo === main after load c ===
  super db load -q -use TABLE c.sup
  super db -s -c "from TABLE"
  echo === child after main load c ===
  super db -s -c "from TABLE@child"
  echo === main after child load a and merge ===
  super db load -q a.sup
  super db merge -q main
  super db -s -c "from TABLE"

inputs:
  - name: a.sup
    data: |
      {k:0,a:1}
  - name: b.sup
    data: |
      {k:1,b:1}
  - name: c.sup
    data: |
      {k:2,c:1}

outputs:
  - name: stdout
    data: |
      === main ===
      {k:0,a:1}
      === child ===
      {k:0,a:1}
      {k:1,b:1}
      === child after merge ===
      {k:0,a:1}
      {k:1,b:1}
      === main after merge ===
      {k:0,a:1}
      {k:1,b:1}
      === main after load c ===
      {k:0,a:1}
      {k:1,b:1}
      {k:2,c:1}
      === child after main load c ===
      {k:0,a:1}
      {k:1,b:1}
      === main after child load a and merge ===
      {k:0,a:1}
      {k:0,a:1}
      {k:1,b:1}
      {k:2,c:1}
