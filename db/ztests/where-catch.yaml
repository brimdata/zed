# A where with a catch handler on a table isn't lifted into the table scan,
# so the handler sees the errors.

script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby y:asc t
  super db load -q -use t in.sup
  super db -s -c 'from t | where x + 1 > 2'
  echo ===
  super db -s -c 'from t | where x + 1 > 2 catch ( values {bad:this} )'

inputs:
  - name: in.sup
    data: |
      {x:2,y:1}
      {x:"a",y:2}
      {x:3,y:3}

outputs:
  - name: stdout
    data: |
      {x:2,y:1}
      {x:3,y:3}
      ===
      {x:2,y:1}
      {bad:error({message:">: error value encountered",on:error("incompatible types")})}
      {x:3,y:3}
