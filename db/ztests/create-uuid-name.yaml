# Test that a table can be given a uuid name and everything still works.
script: |
  super db init -q test
  super db attach -q test
  super db create "01a119bb-45ea-7d50-999a-d46d8e4acb64"
  super db use "01a119bb-45ea-7d50-999a-d46d8e4acb64"
  super db -c 'from "01a119bb-45ea-7d50-999a-d46d8e4acb64"'

outputs:
  - name: stdout
    regexp: |
      table created: 01a119bb-45ea-7d50-999a-d46d8e4acb64 [0-9a-f-]{36}
      Switched to branch "main" on table "01a119bb-45ea-7d50-999a-d46d8e4acb64"
  - name: stderr
    data: ""
