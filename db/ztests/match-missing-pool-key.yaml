# Show that null values of sort key can be retrieved

script: |
  super db init -q test
  super db attach -q test
  super db create -q -orderby k tmp
  super db load -q -use tmp in.sup
  super db -s -c "from tmp | !k.is_ok()"

inputs:
  - name: in.sup
    data: |
      {k:0,v:"zero"}
      {v:"this one missing"}
      {k:1,v:"one"}

outputs:
  - name: stdout
    data: |
      {v:"this one missing"}
