script: |
  super db init -q test
  super db attach -q test
  super db create -q logs
  ! super db load -q -use logs missingfield.sup

inputs:
  - name: missingfield.sup
    data: |
      type foo={a:string,b:string}
      {a:"a",b:"b"}::foo
      {a:"a"}::foo

outputs:
  - name: stderr
    regexp: |
      non-optional field "b" of record decorator "foo" not present in record value
