script: |
  super db init -q test
  super db attach -q test
  super db create -q test
  super db log -use test
  super db -c 'from test@main:objects'
  super db -c 'from test@main:partitions'
  super db -c 'from test@main:rawlog'

outputs: 
  - name: stdout
    data: ""
  - name: stderr
    data: ""
