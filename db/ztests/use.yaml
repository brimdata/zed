script: |
  export SUPER_DB=test
  super db init -q
  ! super db use
  ! super db use @main
  super db create -q TABLE
  ! super db use TABLE@branch
  echo ===
  super db use TABLE
  super db use > no-args-use.txt
  echo ===
  super db branch -q b1
  super db use @b1
  echo ===
  super db branch -q b2
  super db use TABLE@b2

outputs:
  - name: stdout
    data: |
      ===
      Switched to branch "main" on table "TABLE"
      ===
      Switched to branch "b1" on table "TABLE"
      ===
      Switched to branch "b2" on table "TABLE"
  - name: stderr
    data: |
      default table and branch unset
      default table unset
      "branch": branch not found
  - name: no-args-use.txt
    regexp: |
      HEAD at TABLE@main
      Attached to /.*/test
