script: |
  super db init -q test
  super db attach -q test
  ! super db -c 'from HEAD'
  ! super db -c 'from :unknownmeta'
  ! super db -c 'from doesnotexist'

outputs:
  - name: stderr
    data: |
      HEAD: table not found at line 1, column 6:
      from HEAD
           ~~~~
      unknown database metadata type "unknownmeta" in from operator at line 1, column 6:
      from :unknownmeta
           ~~~~~~~~~~~~
      doesnotexist: table not found at line 1, column 6:
      from doesnotexist
           ~~~~~~~~~~~~
